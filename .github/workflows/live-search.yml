# Живая проверка поиска: настоящие запросы к Deezer, Apple, MusicBrainz, Audius,
# а при наличии секретов YT_API_KEY, SC_CLIENT_ID и SC_CLIENT_SECRET ещё к YouTube и SoundCloud.
# Результат виден в сводке запуска (Summary). Сеть GitHub находится не в России.
name: Live search check

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/live/**', '.github/workflows/live-search.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund
        timeout-minutes: 10
      - name: Поиск на настоящих сервисах
        env:
          LIVE: '1'
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          SC_CLIENT_ID: ${{ secrets.SC_CLIENT_ID }}
          SC_CLIENT_SECRET: ${{ secrets.SC_CLIENT_SECRET }}
        run: npx vitest run tests/live --reporter verbose
